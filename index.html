<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flag Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Flag Builder</h1>
    <div class="target-bar">
      <div class="mode-options" role="group" aria-label="Game mode">
        <button id="daily-btn" class="primary" onclick="loadDailyChallenge()">📅 Daily Play</button>
        <button id="random-country-btn" onclick="loadRandomCountry()" disabled>🔀 Random</button>
        <button id="free-play-btn" onclick="setFreePlay()">🎲 Free Play</button>
      </div>
      <div class="target-options">
        <label for="country-search"><strong>Country Picker:</strong></label>
        <input
          type="text"
          id="country-search"
          list="country-list"
          placeholder="Search country..."
          oninput="handleCountrySelect(this.value)"
          onfocus="this.select()"
          disabled
        >
        <datalist id="country-list"></datalist>
        <span id="target-points" style="font-size: 0.85rem; color: var(--accent);">Loading...</span>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <div class="canvas-container">
      <div class="flag-stage">
        <svg id="flag-svg" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
          <g id="layer-group"></g>
          <g id="guide-group"></g>
          <g id="handle-group"></g>
        </svg>
      </div>
      <div class="form-row">
        <button class="primary" id="submit-btn" onclick="evaluateSubmission()">Submit & Score</button>
        <button onclick="clearCanvas()">Clear Canvas</button>
      </div>
    </div>

    <div class="panel">
      <div class="form-group">
        <h2>Add Component Shape</h2>
        <div class="form-row">
          <select id="shape-type" onchange="toggleShapeSubOptions()">
            <option value="Rectangle">Rectangle</option>
            <option value="Circle">Circle</option>
            <option value="Triangle">Triangle</option>
            <option value="Star">Star</option>
            <option value="Crescent">Crescent</option>
            <option value="Cross">Cross</option>
          </select>
        </div>

        <div id="star-options" class="sub-option-row" style="display: none;">
          <label for="star-points" style="font-size: 0.85rem;"><strong>Star Points:</strong></label>
          <select id="star-points">
            <option value="4">4 Points</option>
            <option value="5" selected>5 Points</option>
            <option value="6">6 Points</option>
            <option value="7">7 Points</option>
            <option value="8">8 Points</option>
            <option value="12">12 Points</option>
            <option value="24">24 Points</option>
          </select>
        </div>

        <div id="cross-options" class="sub-option-row" style="display: none;">
          <label for="cross-style" style="font-size: 0.85rem;"><strong>Cross Style:</strong></label>
          <select id="cross-style">
            <option value="regular">Regular cross</option>
            <option value="saltaire">Saltaire</option>
            <option value="nordic">Nordic cross</option>
          </select>
          <label for="cross-thickness" style="font-size: 0.85rem;"><strong>Thickness:</strong></label>
          <select id="cross-thickness">
            <option value="20">Thin</option>
            <option value="35" selected>Medium</option>
            <option value="50">Thick</option>
            <option value="70">Extra thick</option>
          </select>
        </div>

        <div class="form-row color-row">
          <div id="color-picker" class="color-picker" role="group" aria-label="Flag colour">
            <button type="button" class="color-swatch" data-color="Deep red" title="Deep red" aria-label="Deep red"></button>
            <button type="button" class="color-swatch" data-color="Red" title="Red" aria-label="Red"></button>
            <button type="button" class="color-swatch" data-color="Orange" title="Orange" aria-label="Orange"></button>
            <button type="button" class="color-swatch" data-color="Yellow" title="Yellow" aria-label="Yellow"></button>
            <button type="button" class="color-swatch" data-color="Deep green" title="Deep green" aria-label="Deep green"></button>
            <button type="button" class="color-swatch" data-color="Green" title="Green" aria-label="Green"></button>
            <button type="button" class="color-swatch" data-color="Deep blue" title="Deep blue" aria-label="Deep blue"></button>
            <button type="button" class="color-swatch" data-color="Blue" title="Blue" aria-label="Blue"></button>
            <button type="button" class="color-swatch" data-color="Light blue" title="Light blue" aria-label="Light blue"></button>
            <button type="button" class="color-swatch" data-color="White" title="White" aria-label="White"></button>
            <button type="button" class="color-swatch" data-color="Black" title="Black" aria-label="Black"></button>
          </div>
        </div>

        <div class="form-row add-shape-row">
          <button class="primary" onclick="addElement()">+ Add</button>
        </div>
      </div>

        <div class="form-group">
          <h2>Special & Other Elements</h2>
          <div class="form-row">
            <button class="secondary" onclick="addSunElement()">☀️ Add Sun</button>
            <button class="secondary" onclick="addCoatOfArmsPreset()">🛡️ Shield Crest</button>
          </div>

          <div class="form-row" style="margin-top: 0.75rem;">
            <label for="emblem-select" style="font-size: 0.85rem; width: 100%;">
              <strong>National Emblem / Coat of Arms:</strong>
            </label>
          </div>
          <div class="form-row" style="margin-top: 0.25rem;">
            <select id="emblem-select" style="flex: 1;" disabled>
              <option value="">Loading emblems...</option>
            </select>
            <button class="primary" id="add-emblem-btn" onclick="addSelectedEmblem()" disabled>+ Add</button>
          </div>
        </div>

      <div class="form-group">
        <h2>Active Layer Stack</h2>
        <p style="font-size:0.78rem; color:var(--text-muted);">
          Drag shape to move. Drag handles to resize or top icon to rotate (snaps to edges & common angles).
        </p>
        <div id="layer-list" class="layer-list"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="script.js" defer></script>
</body>
</html>
