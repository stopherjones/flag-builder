<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flag Assembler - Visual Comparison & Rotation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Flag Assembler</h1>
    <div class="target-bar">
      <button id="daily-btn" class="primary" onclick="loadDailyChallenge()">📅 Daily Challenge</button>
      <label for="country-search"><strong>Free Search:</strong></label>
      <input 
        type="text" 
        id="country-search" 
        list="country-list" 
        placeholder="Search country..." 
        oninput="handleCountrySelect(this.value)" 
        onfocus="this.select()"
        disabled
      >
      <datalist id="country-list"></datalist>
      <span id="target-points" style="font-size: 0.85rem; color: var(--accent);">Loading...</span>
    </div>
  </header>

  <div class="app-layout">
    <div class="canvas-container">
      <div class="flag-stage">
        <svg id="flag-svg" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
          <g id="layer-group"></g>
          <g id="guide-group"></g>
          <g id="handle-group"></g>
        </svg>
      </div>
      <div class="form-row">
        <button class="primary" id="submit-btn" onclick="evaluateSubmission()">Submit & Score</button>
        <button onclick="clearCanvas()">Clear Canvas</button>
      </div>
    </div>

    <div class="panel">
      <div class="form-group">
        <h2>Add Component Shape</h2>
        <div class="form-row">
          <select id="shape-type">
            <option value="Rectangle">Rectangle</option>
            <option value="Circle">Circle</option>
            <option value="Triangle">Triangle</option>
            <option value="Star">Star</option>
            <option value="Cross">Cross</option>
          </select>
          
          <select id="shape-color">
            <option value="Black">Black</option>
            <option value="Blue">Blue</option>
            <option value="Green">Green</option>
            <option value="Orange">Orange</option>
            <option value="Red">Red</option>
            <option value="White">White</option>
            <option value="Yellow">Yellow</option>
          </select>

          <button class="primary" onclick="addElement()">+ Add</button>
        </div>
      </div>

      <div class="form-group">
        <h2>Active Layer Stack</h2>
        <p style="font-size:0.78rem; color:var(--text-muted);">
          Drag shape to move. Drag handles to resize or top icon to rotate (snaps to edges & common angles).
        </p>
        <div id="layer-list" class="layer-list"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="script.js" defer></script>
</body>
</html>
